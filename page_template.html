<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coleções 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f6f7f8;
    color: #202124;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px 8px; }
  header h1 { font-size: 24px; color: #202124; }
  header .subtitle { color: #5f6368; font-size: 13px; margin-top: 2px; }
  .hamburger {
    position: fixed; top: 16px; left: 16px; z-index: 2000;
    width: 40px; height: 40px;
    background: #fff; border: 1px solid #dadce0; border-radius: 10px;
    cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
    transition: background .15s;
  }
  .hamburger:hover { background: #f1f3f4; }
  .hamburger span { display: block; width: 18px; height: 2px; background: #3c4043; border-radius: 1px; }
  .sidebar-overlay {
    display: none; position: fixed; inset: 0; z-index: 1500;
    background: rgba(0,0,0,.35);
  }
  .sidebar-overlay.open { display: block; }
  .sidebar {
    position: fixed; top: 0; left: -280px; z-index: 1600;
    width: 280px; height: 100vh;
    background: #fff; box-shadow: 4px 0 16px rgba(0,0,0,.15);
    transition: left .25s ease; overflow-y: auto;
    padding: 60px 0 20px;
  }
  .sidebar.open { left: 0; }
  .sidebar-title {
    padding: 0 20px 12px; font-size: 13px; font-weight: 600;
    color: #5f6368; text-transform: uppercase; letter-spacing: .5px;
    border-bottom: 1px solid #e8eaed; margin-bottom: 4px;
  }
  .sidebar-item {
    display: block; width: 100%; text-align: left;
    padding: 12px 20px; border: none; background: none;
    font-size: 15px; color: #3c4043; cursor: pointer;
    transition: background .12s;
  }
  .sidebar-item:hover { background: #f1f3f4; }
  .sidebar-item.active { background: #e8f0fe; color: #1a73e8; font-weight: 600; }
  .view-toggle {
    display: flex; gap: 4px; background: #e8eaed; border-radius: 8px; padding: 3px;
  }
  .view-btn {
    border: none; background: transparent; cursor: pointer;
    padding: 6px 10px; border-radius: 6px; font-size: 13px;
    color: #5f6368; transition: all .15s; display: flex; align-items: center; gap: 4px;
  }
  .view-btn.active { background: #fff; color: #202124; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .view-btn svg { width: 16px; height: 16px; }
  main { flex: 1; padding: 8px 24px 32px; }
  .grid {
    display: none;
    max-width: 1200px;
    margin: 0 auto;
    gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .grid.active { display: grid; }
  .grid.list-view {
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 1px 3px rgba(60,64,67,.12);
    cursor: pointer;
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: 0 4px 12px rgba(60,64,67,.2); transform: translateY(-2px); }
  .grid.list-view .card {
    flex-direction: row;
    border-radius: 10px;
  }
  .grid.list-view .card:hover { transform: translateY(-1px); }
  .thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #e8eaed;
    display: block;
  }
  .grid.list-view .thumb {
    width: 80px; min-height: 80px;
    aspect-ratio: auto;
  }
  .thumb.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px;
    color: #5f6368;
    font-weight: 600;
    font-size: 14px;
    background: linear-gradient(135deg, #e8eaed, #dadce0);
  }
  .card-body {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .card-title { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .card-sub { color: #5f6368; font-size: 12px; }
  .btn { display: none; }
  .footer { text-align: center; color: #5f6368; font-size: 12px; padding: 30px 0 10px; }
  .config-panel {
    display: none;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px;
  }
  .config-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .config-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .config-status {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
    font-family: monospace;
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
  }
  .config-status.success {
    background: #e6f4ea;
    color: #1e8e3e;
    border: 1px solid #ceead6;
    display: block;
  }
  .config-status.error {
    background: #fce8e6;
    color: #d93025;
    border: 1px solid #f5c6cb;
    display: block;
  }
  .config-status.loading {
    background: #e8f0fe;
    color: #1a73e8;
    border: 1px solid #d2e3fc;
    display: block;
  }
  .config-tab-card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(60,64,67,.12);
  }
  .config-tab-card h3 {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    font-size: 16px;
  }
  .config-tab-card .fields {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .config-tab-card label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: #3c4043;
    cursor: pointer;
  }
  .config-tab-card input,
  .config-tab-card select {
    border: 1px solid #dadce0;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    color: #202124;
    background: #fff;
    outline: none;
    transition: border-color .15s;
  }
  .config-tab-card input:focus,
  .config-tab-card select:focus {
    border-color: #1a73e8;
  }
  .config-tab-card h3 input[data-field="name"] {
    flex: 1;
    min-width: 160px;
    font-size: 16px;
    font-weight: 600;
    border: 1px solid #dadce0;
    border-radius: 8px;
    padding: 6px 10px;
  }
  .config-tab-card .links-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .config-tab-card .link-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .config-tab-card .link-row input {
    flex: 1;
  }
  .btn-add-link {
    border: 1px dashed #1a73e8;
    background: transparent;
    color: #1a73e8;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 4px;
    transition: background .15s;
  }
  .btn-add-link:hover { background: #e8f0fe; }
  .btn-remove-link {
    border: none;
    background: #d93025;
    color: #fff;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .15s;
  }
  .btn-remove-link:hover { background: #b52b1c; }
  .btn-add-tab {
    border: none;
    background: #1e8e3e;
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 16px;
    transition: background .15s;
  }
  .btn-add-tab:hover { background: #1a7a34; }
  .btn-save {
    border: none;
    background: #1a73e8;
    color: #fff;
    padding: 10px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background .15s;
  }
  .btn-save:hover { background: #1765cc; }
  .btn-rebuild {
    border: none;
    background: #1a73e8;
    color: #fff;
    padding: 10px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background .15s;
  }
  .btn-rebuild:hover { background: #1765cc; }
  .btn-rebuild.running {
    background: #dadce0;
    color: #3c4043;
    cursor: wait;
  }
  .config-tab-card .btn-remove {
    border: none;
    background: #d93025;
    color: #fff;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: auto;
    flex-shrink: 0;
    transition: background .15s;
  }
  .config-tab-card .btn-remove:hover { background: #b52b1c; }
  .config-section { margin-bottom: 8px; }
  .upload-zone {
    border: 2px dashed #dadce0;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    background: #fafafa;
  }
  .upload-zone:hover,
  .upload-zone.dragover {
    border-color: #1a73e8;
    background: #e8f0fe;
  }
  .upload-zone .upload-icon { font-size: 48px; margin-bottom: 8px; }
  .upload-zone p { color: #5f6368; font-size: 14px; margin: 4px 0; }
  .upload-zone a { color: #1a73e8; text-decoration: none; }
  .upload-zone a:hover { text-decoration: underline; }
  .upload-hint { font-size: 12px !important; color: #9aa0a6 !important; }
  .upload-progress {
    margin-top: 12px;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    background: #e8f0fe;
    color: #1a73e8;
    display: none;
  }
  .uploaded-files { margin-top: 12px; }
  .uploaded-file {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid #e8eaed;
    border-radius: 8px;
    margin-bottom: 6px;
    background: #fff;
  }
  .uploaded-file .file-name { flex: 1; color: #202124; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uploaded-file .file-size { color: #5f6368; font-size: 12px; }
  .uploaded-file .btn-del {
    border: none; background: #fce8e6; color: #d93025;
    width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer; font-size: 12px; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
    transition: background .15s;
  }
  .uploaded-file .btn-del:hover { background: #fce8e6; }
  .link-row.duplicate { background: #fce8e6; border-radius: 8px; padding: 4px 8px; margin: -4px -8px; }
  .link-row.duplicate input { border-color: #d93025; }
  .link-row.duplicate .dup-hint { color: #d93025; font-size: 11px; margin-top: 2px; }
  .loading-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: #f6f7f8;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity .4s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-overlay h2 { font-size: 20px; color: #202124; margin-bottom: 8px; }
  .loading-overlay p { color: #5f6368; font-size: 14px; margin-bottom: 20px; }
  .loading-bar-track {
    width: 320px; max-width: 80vw; height: 8px;
    background: #e0e0e0; border-radius: 4px; overflow: hidden;
  }
  .loading-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #1a73e8, #34a853);
    border-radius: 4px; transition: width .2s;
  }
  .loading-pct { margin-top: 10px; font-size: 13px; color: #5f6368; font-family: monospace; }
  @media (max-width: 600px) {
    .sidebar { width: 260px; }
    header { padding: 12px 16px 8px; }
    header h1 { font-size: 20px; }
    main { padding: 8px 12px 24px; }
    .grid { gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .grid.list-view .thumb { width: 60px; min-height: 60px; }
    .landing-title { font-size: 48px !important; }
  }

  /* Landing page */
  .landing {
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; transition: opacity .6s ease, visibility .6s ease;
  }
  .landing.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .landing-title {
    font-size: 80px; font-weight: 900;
    color: transparent;
    background: linear-gradient(135deg, #00d2ff, #3a7bd5, #00d2ff);
    -webkit-background-clip: text; background-clip: text;
    text-shadow: none;
    letter-spacing: 4px;
    animation: float3d 3s ease-in-out infinite;
    text-align: center; line-height: 1.1;
    filter: drop-shadow(0 8px 32px rgba(58,123,213,.5));
  }
  .landing-sub {
    font-size: 18px; color: rgba(255,255,255,.5);
    margin-top: 24px; letter-spacing: 6px; text-transform: uppercase;
    animation: fadeInUp .8s ease .3s both;
  }
  .landing-hint {
    position: absolute; bottom: 40px;
    font-size: 14px; color: rgba(255,255,255,.3);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes float3d {
    0%, 100% { transform: perspective(500px) rotateX(5deg) translateY(0); }
    50% { transform: perspective(500px) rotateX(-5deg) translateY(-10px); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: .3; }
    50% { opacity: .7; }
  }

  /* Search */
  .search-box {
    display: none; width: 100%; max-width: 500px;
    margin: 0 auto; position: relative;
  }
  .search-box.visible { display: block; }
  .search-input {
    width: 100%; padding: 12px 16px 12px 42px;
    border: 2px solid #dadce0; border-radius: 12px;
    font-size: 16px; background: #fff; outline: none;
    transition: border-color .2s;
  }
  .search-input:focus { border-color: #1a73e8; }
  .search-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: #9aa0a6; font-size: 18px; pointer-events: none;
  }
  .search-results-info {
    text-align: center; padding: 8px 0; font-size: 13px; color: #5f6368;
    display: none;
  }
  .search-results-info.visible { display: block; }
</style>
</head>
<body>
<div class="landing" id="landing" onclick="dismissLanding()">
  <div class="landing-title">ARQUIVOS<br>3D</div>
  <div class="landing-sub">Modelos para impressão 3D</div>
  <div class="landing-hint">Clique para entrar</div>
</div>

<div class="loading-overlay" id="loading-overlay">
  <h2>Carregando colecoes...</h2>
  <p>Aguarde enquanto os dados sao carregados</p>
  <div class="loading-bar-track"><div class="loading-bar-fill" id="loading-bar"></div></div>
  <div class="loading-pct" id="loading-pct">0%</div>
</div>

<button class="hamburger" id="hamburger-btn" onclick="toggleSidebar()">
  <span></span><span></span><span></span>
</button>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
<nav class="sidebar" id="sidebar">
  <div class="sidebar-title">Categorias</div>
</nav>

<header>
  <div>
    <h1>Coleções 3D</h1>
    <div class="subtitle">Modelos STL para impressão 3D</div>
  </div>
  <div class="view-toggle">
    <button class="view-btn active" id="btn-grid" onclick="setViewMode('grid')" title="Miniaturas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Grade
    </button>
    <button class="view-btn" id="btn-list" onclick="setViewMode('list')" title="Lista">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      Lista
    </button>
  </div>
</header>

<div class="search-box" id="search-box">
  <span class="search-icon">&#128269;</span>
  <input class="search-input" id="search-input" type="text" placeholder="Pesquisar por nome..." oninput="handleSearch(this.value)">
</div>
<div class="search-results-info" id="search-results-info"></div>

<main id="container"></main>

<footer class="footer">Arquivos hospedados no Google Drive &middot; gerado automaticamente</footer>

<script>
window.onerror = function() {
  var o = document.getElementById("loading-overlay");
  if (o) { o.style.display = "none"; }
  return false;
};
setTimeout(function() {
  var o = document.getElementById("loading-overlay");
  if (o) { o.style.display = "none"; }
}, 3000);

__COLLECTIONS__

var currentTab = COLLECTIONS.length > 0 ? COLLECTIONS[0].name : '';
var viewMode = localStorage.getItem('viewMode') || 'grid';
var container = document.getElementById("container");
var sidebar = document.getElementById("sidebar");
var sidebarOverlay = document.getElementById("sidebar-overlay");

COLLECTIONS.forEach(function(c, i) {
  var item = document.createElement("button");
  item.className = "sidebar-item" + (i === 0 ? " active" : "");
  item.textContent = c.name;
  item.setAttribute("data-tab", c.name);
  item.addEventListener("click", function() { selectTab(c.name); });
  sidebar.appendChild(item);
  container.appendChild(buildGrid(c, i === 0));
});

function buildGrid(coll, active) {
  var g = document.createElement("div");
  g.className = "grid" + (active ? " active" : "");
  if (viewMode === 'list') g.classList.add("list-view");
  g.id = "grid-" + coll.name;
  coll.items.forEach(function(it) {
    var card = document.createElement("div");
    card.className = "card";
    var imgSrc = '';
    if (it.img) {
      imgSrc = it.img.indexOf('/') !== -1
        ? it.img
        : 'https://drive.google.com/thumbnail?id=' + it.img + '&sz=w1000';
    }
    var thumb = imgSrc
      ? '<img class="thumb" loading="lazy" data-src="' + imgSrc + '" alt="' + it.title + '">'
      : '<div class="thumb placeholder">' + it.title + '</div>';
    var href = it.link || (it.zip ? 'https://drive.usercontent.google.com/download?id=' + it.zip + '&export=download&confirm=t' : '');
    card.setAttribute('data-href', href);
    if (it.link) card.setAttribute('data-external', '1');
    card.onclick = function() { openLink(this); };
    card.innerHTML =
      thumb +
      '<div class="card-body">' +
        '<div>' +
          '<div class="card-title">' + it.title + '</div>' +
          '<div class="card-sub">' + it.sub + '</div>' +
        '</div>' +
      '</div>';
    g.appendChild(card);
  });
  return g;
}

function openLink(a) {
  var h = a.getAttribute('data-href');
  if (!h) return;
  var ext = a.getAttribute('data-external');
  if (ext) window.open(h, '_blank');
  else window.location.href = h;
}

function selectTab(name) {
  currentTab = name;
  document.querySelectorAll(".sidebar-item").forEach(function(t) {
    t.classList.toggle("active", t.getAttribute("data-tab") === name);
  });
  document.querySelectorAll(".grid").forEach(function(g) {
    g.classList.toggle("active", g.id === "grid-" + name);
  });
  var cp = document.getElementById("config-panel");
  if (cp) {
    cp.style.display = (name === "Configurações") ? "block" : "none";
    if (name === "Configurações" && !cp.dataset.loaded && window.__SERVER__) loadConfig();
  }
  var searchBox = document.getElementById("search-box");
  var searchInfo = document.getElementById("search-results-info");
  if (name === "Pesquisa") {
    if (searchBox) searchBox.classList.add("visible");
    document.querySelectorAll(".grid").forEach(function(g) { g.classList.remove("active"); });
    var searchGrid = document.getElementById("grid-Pesquisa");
    if (searchGrid) searchGrid.classList.add("active");
    var si = document.getElementById("search-input");
    if (si) si.focus();
  } else {
    if (searchBox) searchBox.classList.remove("visible");
    if (searchInfo) searchInfo.classList.remove("visible");
    var searchGrid = document.getElementById("grid-Pesquisa");
    if (searchGrid) searchGrid.classList.remove("active");
    var si = document.getElementById("search-input");
    if (si) { si.value = ''; handleSearch(''); }
  }
  var g = document.getElementById("grid-" + name);
  if (g) _loadVisibleImages(g);
  closeSidebar();
}

function toggleSidebar() {
  sidebar.classList.toggle("open");
  sidebarOverlay.classList.toggle("open");
}

function closeSidebar() {
  sidebar.classList.remove("open");
  sidebarOverlay.classList.remove("open");
}

function setViewMode(mode) {
  viewMode = mode;
  localStorage.setItem('viewMode', mode);
  document.getElementById("btn-grid").classList.toggle("active", mode === "grid");
  document.getElementById("btn-list").classList.toggle("active", mode === "list");
  document.querySelectorAll(".grid").forEach(function(g) {
    g.classList.toggle("list-view", mode === "list");
  });
}

setViewMode(viewMode);

(function() {

  var imgs = grid.querySelectorAll("img[data-src]");
  imgs.forEach(function(img) {
    img.src = img.getAttribute("data-src");
    img.removeAttribute("data-src");
  });
}

let configData = null;

function loadConfig() {
  var panel = document.getElementById("config-panel");
  if (!window.__SERVER__) {
    panel.innerHTML = '<div class="config-status error">Execute: node sistema/server.js</div>';
    return;
  }
  panel.innerHTML = '<div class="config-status loading">Carregando configurações...</div>';
  fetch("/api/config")
    .then(function(r) { return r.json(); })
    .then(function(data) {
      configData = data;
      panel.dataset.loaded = "1";
      renderConfigPanel(data);
    })
    .catch(function(e) {
      panel.innerHTML = '<div class="config-status error">Erro ao carregar: ' + e.message + '</div>';
    });
}

function renderConfigPanel(data) {
  var panel = document.getElementById("config-panel");
  var html = '<div class="config-header">' +
    '<h2 style="font-size:22px;margin:0">Configurações</h2>' +
    '<div class="config-actions">' +
      '<button class="btn-save" onclick="saveConfig()">Salvar</button>' +
      '<button class="btn-rebuild" id="btn-rebuild" onclick="rebuildPage()">Rebuild</button>' +
    '</div>' +
  '</div>' +
  '<div class="config-section">' +
    '<h3 style="font-size:16px;margin:20px 0 12px;color:#202124">Abas</h3>' +
    '<div id="config-cards"></div>' +
    '<button class="btn-add-tab" onclick="addTab()">+ Nova Aba</button>' +
  '</div>' +
  '<div class="config-section">' +
    '<h3 style="font-size:16px;margin:20px 0 12px;color:#202124">Upload de Arquivos</h3>' +
    '<div class="upload-zone" id="upload-zone" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">' +
      '<input type="file" id="file-input" multiple style="display:none" onchange="handleFileSelect(event)" />' +
      '<div class="upload-icon">&#128194;</div>' +
      '<p>Arraste arquivos aqui ou <a href="#" onclick="document.getElementById(\'file-input\').click();return false">clique para selecionar</a></p>' +
      '<p class="upload-hint">Imagens, ZIPs, ou qualquer arquivo</p>' +
    '</div>' +
    '<div class="upload-progress" id="upload-progress" style="display:none"></div>' +
    '<div id="uploaded-files" class="uploaded-files"></div>' +
  '</div>' +
  '<div class="config-status" id="config-status"></div>';
  panel.innerHTML = html;

  var cardsContainer = document.getElementById("config-cards");
  (data.tabs || []).forEach(function(tab) { cardsContainer.appendChild(buildConfigCard(tab)); });
  loadUploadedFiles();
}

function buildConfigCard(tab) {
  var card = document.createElement("div");
  card.className = "config-tab-card";

  var type = tab.type || "drive";
  var expand = !!tab.expand;

  var typeOptions = '<option value="drive"' + (type === "drive" ? " selected" : "") + '>drive</option>' +
    '<option value="static"' + (type === "static" ? " selected" : "") + '>static</option>' +
    '<option value="updates"' + (type === "updates" ? " selected" : "") + '>updates</option>';

  var fieldsHtml = "";
  if (type === "drive") {
    if (expand) {
      var links = Array.isArray(tab.links) ? tab.links : [];
      fieldsHtml += '<div class="links-list">';
      links.forEach(function(url) {
        fieldsHtml += '<div class="link-row">' +
          '<input placeholder="URL" data-field="url" value="' + escapeAttr(url) + '" oninput="checkDup(this)" />' +
          '<button class="btn-remove-link" onclick="removeLink(this)">X</button>' +
        '</div>';
      });
      fieldsHtml += '</div>';
      fieldsHtml += '<button class="btn-add-link" onclick="addLink(this)">+ Link</button>';
    } else {
      var links2 = Array.isArray(tab.links) ? tab.links : [];
      fieldsHtml += '<div class="links-list">';
      links2.forEach(function(link) {
        var url = typeof link === "string" ? link : (link.url || "");
        var label = typeof link === "object" ? (link.label || "") : "";
        fieldsHtml += '<div class="link-row">' +
          '<input placeholder="URL" data-field="url" value="' + escapeAttr(url) + '" oninput="checkDup(this)" />' +
          '<input placeholder="Label" data-field="label" value="' + escapeAttr(label) + '" />' +
          '<button class="btn-remove-link" onclick="removeLink(this)">X</button>' +
        '</div>';
      });
      fieldsHtml += '</div>';
      fieldsHtml += '<button class="btn-add-link" onclick="addLink(this)">+ Link</button>';
    }
  } else if (type === "static") {
    fieldsHtml += '<div class="fields" style="flex-direction:row;align-items:center;gap:10px">' +
      '<label>Arquivo:</label>' +
      '<input placeholder="ex: tab_avioes.js" data-field="file" value="' + escapeAttr(tab.file || "") + '" />' +
    '</div>';
  } else if (type === "updates") {
    fieldsHtml += '<div class="fields" style="flex-direction:row;align-items:center;gap:10px">' +
      '<label>Max:</label>' +
      '<input type="number" data-field="max" value="' + (tab.max || 80) + '" style="width:80px" />' +
    '</div>';
  }

  card.innerHTML = '<h3>' +
    '<input class="tab-name-input" data-field="name" value="' + escapeAttr(tab.name || "") + '" />' +
    '<select data-field="type" onchange="onTypeChange(this)">' + typeOptions + '</select>' +
    (type === "drive" ? '<label><input type="checkbox" data-field="expand"' + (expand ? ' checked' : '') + ' onchange="onExpandChange(this)" /> expand</label>' : '') +
    '<button class="btn-remove" onclick="removeTab(this)">X</button>' +
  '</h3>' +
  '<div class="fields">' + fieldsHtml + '</div>';

  return card;
}

function escapeAttr(str) {
  return String(str).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function onTypeChange(sel) {
  var card = sel.closest(".config-tab-card");
  var name = card.querySelector('[data-field="name"]').value;
  var expand = card.querySelector('[data-field="expand"]');
  var tab = { name: name, type: sel.value, expand: expand ? expand.checked : false };
  var newCard = buildConfigCard(tab);
  card.replaceWith(newCard);
}

function onExpandChange(cb) {
  var card = cb.closest(".config-tab-card");
  var name = card.querySelector('[data-field="name"]').value;
  var type = card.querySelector('[data-field="type"]').value;
  var tab = { name: name, type: type, expand: cb.checked };
  var newCard = buildConfigCard(tab);
  card.replaceWith(newCard);
}

function addTab() {
  var cardsContainer = document.getElementById("config-cards");
  cardsContainer.appendChild(buildConfigCard({ name: "Nova Aba", type: "drive", expand: false, links: [] }));
}

function removeTab(btn) {
  btn.closest(".config-tab-card").remove();
}

function addLink(btn) {
  var card = btn.closest(".config-tab-card");
  var isExpand = card.querySelector('[data-field="expand"]');
  var expandChecked = isExpand && isExpand.checked;
  var linksList = btn.previousElementSibling;
  var row = document.createElement("div");
  row.className = "link-row";
  row.innerHTML = '<input placeholder="URL" data-field="url" value="" oninput="checkDup(this)" />' +
    (!expandChecked ? '<input placeholder="Label" data-field="label" value="" />' : '') +
    '<button class="btn-remove-link" onclick="removeLink(this)">X</button>';
  linksList.appendChild(row);
  row.querySelector('[data-field="url"]').focus();
}

function checkDup(input) {
  var card = input.closest(".config-tab-card");
  var url = input.value.trim();
  if (!url) {
    input.closest(".link-row").classList.remove("duplicate");
    var oldHint = input.closest(".link-row").querySelector(".dup-hint");
    if (oldHint) oldHint.remove();
    return;
  }
  var allInputs = card.querySelectorAll('[data-field="url"]');
  var count = 0;
  allInputs.forEach(function(inp) {
    if (inp.value.trim() === url) count++;
  });
  var row = input.closest(".link-row");
  var hint = row.querySelector(".dup-hint");
  if (count > 1) {
    row.classList.add("duplicate");
    if (!hint) {
      hint = document.createElement("div");
      hint.className = "dup-hint";
      hint.textContent = "Link duplicado";
      row.appendChild(hint);
    }
  } else {
    row.classList.remove("duplicate");
    if (hint) hint.remove();
  }
}

function removeLink(btn) {
  btn.closest(".link-row").remove();
}

function collectConfigData() {
  var cards = document.querySelectorAll(".config-tab-card");
  var tabs = [];
  var totalDups = 0;
  cards.forEach(function(card) {
    var name = card.querySelector('[data-field="name"]').value;
    var type = card.querySelector('[data-field="type"]').value;
    var expandEl = card.querySelector('[data-field="expand"]');
    var expand = expandEl ? expandEl.checked : false;
    var tab = { name: name, type: type };
    if (type === "drive") {
      tab.expand = expand;
      var linkRows = card.querySelectorAll(".link-row");
      var links = [];
      var seen = {};
      linkRows.forEach(function(row) {
        var url = row.querySelector('[data-field="url"]').value.trim();
        if (!url) return;
        if (seen[url]) { totalDups++; return; }
        seen[url] = true;
        if (expand) {
          links.push(url);
        } else {
          var label = row.querySelector('[data-field="label"]').value;
          links.push({ url: url, label: label });
        }
      });
      tab.links = links;
    } else if (type === "static") {
      var fileEl = card.querySelector('[data-field="file"]');
      tab.file = fileEl ? fileEl.value : "";
    } else if (type === "updates") {
      var maxEl = card.querySelector('[data-field="max"]');
      tab.max = maxEl ? parseInt(maxEl.value, 10) || 80 : 80;
    }
    tabs.push(tab);
  });
  if (totalDups > 0) showStatus(totalDups + " link(s) duplicado(s) removido(s) automaticamente.", "loading");
  return { tabs: tabs };
}

function showStatus(msg, type) {
  var el = document.getElementById("config-status");
  if (!el) return;
  el.className = "config-status " + type;
  el.textContent = msg;
  el.style.display = "block";
}

function saveConfig() {
  var data = collectConfigData();
  showStatus("Salvando...", "loading");
  fetch("/api/config", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
    .then(function(r) { return r.json(); })
    .then(function() { showStatus("Configurações salvas com sucesso!", "success"); })
    .catch(function(e) { showStatus("Erro ao salvar: " + e.message, "error"); });
}

function rebuildPage() {
  var btn = document.getElementById("btn-rebuild");
  if (btn) { btn.classList.add("running"); btn.disabled = true; }
  showStatus("Iniciando rebuild...", "loading");
  fetch("/api/rebuild", { method: "POST" })
    .then(function() { pollRebuildStatus(); })
    .catch(function(e) { showStatus("Erro ao iniciar rebuild: " + e.message, "error"); if (btn) { btn.classList.remove("running"); btn.disabled = false; } });
}

function pollRebuildStatus() {
  var btn = document.getElementById("btn-rebuild");
  var poll = setInterval(function() {
    fetch("/api/status")
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var status = document.getElementById("config-status");
        if (status && data.output) {
          var lines = Array.isArray(data.output) ? data.output.slice(-8) : String(data.output).split("\n").slice(-8);
          status.className = "config-status loading";
          status.textContent = lines.join("\n");
          status.style.display = "block";
        }
        if (data.done) {
          clearInterval(poll);
          showStatus("Concluido!", "success");
          if (btn) { btn.classList.remove("running"); btn.disabled = false; }
          setTimeout(function() { location.reload(); }, 2000);
        }
      })
      .catch(function() {});
  }, 2000);
}

function handleDragOver(e) {
  e.preventDefault();
  e.stopPropagation();
  var zone = document.getElementById("upload-zone");
  if (zone) zone.classList.add("dragover");
}

function handleDragLeave(e) {
  e.preventDefault();
  e.stopPropagation();
  var zone = document.getElementById("upload-zone");
  if (zone) zone.classList.remove("dragover");
}

function handleDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  var zone = document.getElementById("upload-zone");
  if (zone) zone.classList.remove("dragover");
  var files = e.dataTransfer.files;
  if (files.length > 0) uploadFiles(files);
}

function handleFileSelect(e) {
  var files = e.target.files;
  if (files.length > 0) uploadFiles(files);
}

function uploadFiles(files) {
  var progress = document.getElementById("upload-progress");
  if (progress) {
    progress.style.display = "block";
    progress.textContent = "Enviando " + files.length + " arquivo(s)...";
  }
  var formData = new FormData();
  for (var i = 0; i < files.length; i++) {
    formData.append("file", files[i]);
  }
  fetch("/api/upload", { method: "POST", body: formData })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (progress) {
        if (data.ok && data.files) {
          progress.textContent = data.files.length + " arquivo(s) enviado(s) com sucesso!";
          setTimeout(function() { progress.style.display = "none"; }, 3000);
        } else {
          progress.textContent = "Erro: " + (data.error || "desconhecido");
          progress.style.color = "#d93025";
        }
      }
      loadUploadedFiles();
    })
    .catch(function(e) {
      if (progress) {
        progress.textContent = "Erro de rede: " + e.message;
        progress.style.color = "#d93025";
      }
    });
}

function loadUploadedFiles() {
  var fileContainer = document.getElementById("uploaded-files");
  if (!fileContainer) return;
  fetch("/api/uploads")
    .then(function(r) { return r.json(); })
    .then(function(files) {
      if (!files || files.length === 0) {
        fileContainer.innerHTML = '<p style="color:#9aa0a6;font-size:13px">Nenhum arquivo enviado ainda.</p>';
        return;
      }
      var html = '';
      files.forEach(function(f) {
        var size = f.size > 1048576 ? (f.size / 1048576).toFixed(1) + ' MB' : (f.size / 1024).toFixed(0) + ' KB';
        html += '<div class="uploaded-file">' +
          '<span class="file-name">' + escapeAttr(f.name) + '</span>' +
          '<span class="file-size">' + size + '</span>' +
          '<button class="btn-del" onclick="deleteUpload(\'' + escapeAttr(f.name) + '\')" title="Excluir">&#10005;</button>' +
        '</div>';
      });
      fileContainer.innerHTML = html;
    })
    .catch(function() {
      fileContainer.innerHTML = '<p style="color:#d93025;font-size:13px">Erro ao carregar arquivos.</p>';
    });
}

function deleteUpload(name) {
  if (!confirm("Excluir " + name + "?")) return;
  fetch("/api/uploads/" + encodeURIComponent(name), { method: "DELETE" })
    .then(function(r) { return r.json(); })
    .then(function() { loadUploadedFiles(); })
    .catch(function() { alert("Erro ao excluir"); });
}

function dismissLanding() {
  var l = document.getElementById("landing");
  if (l) l.classList.add("hidden");
}

var _allItems = [];
COLLECTIONS.forEach(function(c) {
  c.items.forEach(function(it) {
    _allItems.push({ title: it.title, sub: it.sub || '', link: it.link || '', img: it.img || '', tab: c.name });
  });
});

function handleSearch(q) {
  q = q.toLowerCase().trim();
  var info = document.getElementById("search-results-info");
  var container = document.getElementById("container");
  var grids = container.querySelectorAll(".grid");

  if (!q) {
    grids.forEach(function(g) { g.style.display = ''; g.classList.remove("search-hidden"); });
    if (info) { info.classList.remove("visible"); info.textContent = ''; }
    selectTab(currentTab);
    return;
  }

  grids.forEach(function(g) { g.style.display = 'none'; });

  var searchGrid = document.getElementById("grid-Pesquisa");
  if (!searchGrid) {
    searchGrid = document.createElement("div");
    searchGrid.className = "grid active";
    if (viewMode === 'list') searchGrid.classList.add("list-view");
    searchGrid.id = "grid-Pesquisa";
    container.appendChild(searchGrid);
  }
  searchGrid.innerHTML = '';

  var matches = _allItems.filter(function(it) {
    return it.title.toLowerCase().indexOf(q) !== -1 || it.sub.toLowerCase().indexOf(q) !== -1;
  });

  matches.forEach(function(it) {
    var card = document.createElement("div");
    card.className = "card";
    var imgSrc = '';
    if (it.img) {
      imgSrc = it.img.indexOf('/') !== -1
        ? it.img
        : 'https://drive.google.com/thumbnail?id=' + it.img + '&sz=w1000';
    }
    var thumb = imgSrc
      ? '<img class="thumb" loading="lazy" src="' + imgSrc + '" alt="' + it.title + '">'
      : '<div class="thumb placeholder">' + it.title + '</div>';
    var href = it.link || (it.zip ? 'https://drive.usercontent.google.com/download?id=' + it.zip + '&export=download&confirm=t' : '');
    card.setAttribute('data-href', href);
    if (it.link) card.setAttribute('data-external', '1');
    card.onclick = function() { openLink(this); };
    card.innerHTML = thumb +
      '<div class="card-body">' +
        '<div>' +
          '<div class="card-title">' + it.title + '</div>' +
          '<div class="card-sub">' + (it.tab || '') + '</div>' +
        '</div>' +
      '</div>';
    searchGrid.appendChild(card);
  });

  searchGrid.classList.add("active");
  if (info) {
    info.textContent = matches.length + " resultado(s) para \"" + q + "\"";
    info.classList.add("visible");
  }
}

document.getElementById("search-input").addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    this.value = '';
    handleSearch('');
  }
});
